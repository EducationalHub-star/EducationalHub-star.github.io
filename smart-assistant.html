
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Assistant AI</title>

<style>
:root {
  --bg:#ffffff;
  --panel:#f7f7f8;
  --text:#202123;
  --muted:#777;
  --border:#e5e5e5;
  --accent:#2563eb;
  --bubble:#f1f5f9;
}
body.dark {
  --bg:#171717;
  --panel:#222222;
  --text:#eeeeee;
  --muted:#aaa;
  --border:#383838;
  --accent:#60a5fa;
  --bubble:#292929;
}
* {box-sizing:border-box;margin:0;padding:0}
body {
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}
.app {display:flex;height:100vh}
.sidebar {
  width:260px;
  background:var(--panel);
  padding:15px;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--border);
}
.brand {
  font-size:21px;
  font-weight:bold;
  padding:12px 5px 22px;
}
.new-chat,.side-btn {
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  text-align:left;
  cursor:pointer;
  margin-bottom:10px;
}
.new-chat:hover,.side-btn:hover {background:var(--bubble)}
.history-title {
  font-size:12px;
  color:var(--muted);
  margin:20px 5px 10px;
}
.history {
  overflow-y:auto;
  flex:1;
}
.history-item {
  padding:11px;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.history-item:hover {background:var(--bubble)}
.sidebar-bottom {margin-top:auto}
.main {
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}
.topbar {
  height:60px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}
.topbar strong {font-size:17px}
.top-actions {display:flex;gap:8px}
.icon-btn {
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:9px;
  padding:9px 12px;
  cursor:pointer;
}
.menu-btn {display:none}
.chat-area {
  flex:1;
  overflow-y:auto;
  padding:30px 18px;
}
.welcome {
  text-align:center;
  margin:12vh auto 30px;
  max-width:600px;
}
.welcome h1 {
  font-size:30px;
  margin-bottom:12px;
}
.welcome p {
  color:var(--muted);
  line-height:1.6;
}
.messages {
  max-width:760px;
  margin:auto;
}
.message {
  padding:15px 18px;
  margin:15px 0;
  border-radius:14px;
  line-height:1.7;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.user {background:var(--bubble);margin-left:12%}
.assistant {background:transparent}
.composer-wrap {
  padding:15px 18px 10px;
  background:var(--bg);
}
.composer {
  max-width:760px;
  margin:auto;
  border:1px solid var(--border);
  border-radius:18px;
  padding:12px;
  box-shadow:0 3px 15px #0000000c;
}
#prompt {
  width:100%;
  min-height:55px;
  max-height:150px;
  resize:vertical;
  border:0;
  outline:none;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:8px;
}
.composer-actions {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.action-group {display:flex;gap:7px;flex-wrap:wrap}
.send-btn {
  background:var(--accent);
  color:white;
  border:0;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
}
.file-label {
  cursor:pointer;
  background:var(--panel);
  padding:9px 12px;
  border-radius:9px;
  font-size:14px;
}
#fileInput {display:none}
#fileInfo {
  font-size:12px;
  color:var(--muted);
  padding:7px;
}
.disclaimer {
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:8px;
}
footer {text-align:center;color:var(--muted);font-size:11px;padding:5px}
@media(max-width:700px) {
  .sidebar {
    position:fixed;
    z-index:5;
    left:-270px;
    top:0;
    bottom:0;
    transition:left .25s;
  }
  .sidebar.open {left:0}
  .menu-btn {display:block}
  .welcome h1 {font-size:25px}
  .topbar {padding:0 12px}
  .user {margin-left:4%}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">✦ Smart Assistant</div>

  <button class="new-chat" onclick="newChat()">＋ New Chat</button>

  <div class="history-title">RECENT CHATS</div>
  <div class="history" id="history"></div>

  <div class="sidebar-bottom">
    <button class="side-btn" onclick="toggleTheme()">◐ Change Theme</button>
    <button class="side-btn" onclick="showAbout()">ⓘ About</button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="icon-btn menu-btn" onclick="toggleMenu()">☰</button>
      <strong>Smart Assistant AI</strong>
    </div>
    <div class="top-actions">
      <button class="icon-btn" onclick="toggleTheme()">◐</button>
    </div>
  </div>

  <section class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <h1>How can I help you today?</h1>
      <p>Your personal smart assistant for writing, learning, documents and everyday tasks.</p>
    </div>
    <div class="messages" id="messages"></div>
  </section>

  <div class="composer-wrap">
    <div class="composer">
      <textarea id="prompt" placeholder="Message Smart Assistant..." onkeydown="handleEnter(event)"></textarea>

      <div id="fileInfo"></div>

      <div class="composer-actions">
        <div class="action-group">
          <label class="file-label" for="fileInput">＋ Attach</label>
          <input type="file" id="fileInput" accept="image/*,video/*,.pdf,.txt,.doc,.docx" multiple onchange="showFiles()">
          <button class="icon-btn" onclick="startVoice()" title="Voice input">🎙</button>
        </div>
        <button class="send-btn" onclick="sendMessage()">Send ↑</button>
      </div>
    </div>
    <div class="disclaimer">
      Smart Assistant AI can make mistakes. Check important information.
    </div>
  </div>

  <footer>© 2026 Smart Assistant AI</footer>
</main>
</div>

<script>
let chats = [];
let currentChat = [];
let selectedFiles = [];

function addMessage(text, type) {
  const box = document.createElement("div");
  box.className = "message " + type;
  box.textContent = text;
  document.getElementById("messages").appendChild(box);
  document.getElementById("chatArea").scrollTop =
    document.getElementById("chatArea").scrollHeight;
}

function sendMessage() {
  const input = document.getElementById("prompt");
  const text = input.value.trim();

  if (!text && selectedFiles.length === 0) {
    alert("Please write a message or select a file.");
    return;
  }

  document.getElementById("welcome").style.display = "none";

  if (text) {
    addMessage(text, "user");
    currentChat.push({text, type:"user"});
  }

  if (selectedFiles.length) {
    const names = selectedFiles.map(f => f.name).join(", ");
    addMessage("Selected files: " + names, "user");
  }

  addMessage(
    "This is the Smart Assistant preview. Connect an AI backend to receive real AI answers and process uploaded files.",
    "assistant"
  );

  input.value = "";
  selectedFiles = [];
  document.getElementById("fileInput").value = "";
  document.getElementById("fileInfo").textContent = "";
  saveCurrentChat();
}

function handleEnter(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function newChat() {
  currentChat = [];
  document.getElementById("messages").innerHTML = "";
  document.getElementById("welcome").style.display = "block";
  document.getElementById("prompt").value = "";
  document.getElementById("fileInfo").textContent = "";
  selectedFiles = [];
  document.getElementById("fileInput").value = "";
}

function saveCurrentChat() {
  if (currentChat.length === 0) return;
  const title = currentChat[0].text.slice(0,35) || "New Chat";
  const item = {title, messages:[...currentChat]};
  chats.unshift(item);
  renderHistory();
}

function renderHistory() {
  const history = document.getElementById("history");
  history.innerHTML = "";
  chats.forEach((chat) => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent = chat.title;
    div.onclick = () => {
      newChat();
      document.getElementById("welcome").style.display = "none";
      chat.messages.forEach(m => addMessage(m.text,m.type));
    };
    history.appendChild(div);
  });
}

function showFiles() {
  selectedFiles = Array.from(document.getElementById("fileInput").files);
  document.getElementById("fileInfo").textContent =
    selectedFiles.map(f => f.name).join(" • ");
}

function toggleTheme() {
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "smartTheme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
}

if (localStorage.getItem("smartTheme") === "dark") {
  document.body.classList.add("dark");
}

function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("open");
}

function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported by this browser.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "ur-PK";
  recognition.onresult = event => {
    document.getElementById("prompt").value =
      event.results[0][0].transcript;
  };
  recognition.start();
}

function showAbout() {
  alert("Smart Assistant AI\nA multi-purpose assistant project.");
}
</script>
</body>
</html>
